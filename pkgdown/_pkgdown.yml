home:
  title: lumen
  description: Statistical tests, confidence intervals, and distributions for DescToolsX

destination: docs

development:
  mode: auto

template:
  default_assets: true
  bootstrap: 5
  bootswatch: flatly

navbar:
  structure:
    left:  [version, home, reference, news]
    right: [github]
  components:
    version:
      icon: fa-book
      menu:
      - text: "Documentation for version of package:"
      - text: Released
        href: https://andrisignorell.github.io/lumen/
      - text: In-development
        href: https://andrisignorell.github.io/lumen/dev/

# About package ==============================================================
reference:
- title: Package Overview & Interfaces
  desc: >
    Package overview and common formula-interface conventions.
  contents:
  - lumen-package
  - Formulas

- title: Confidence Intervals for Location
  desc: >
    Confidence intervals and sample-size calculations for means, medians, and quantiles.
  contents:
  # ci.general -- General bootstrap interface
  - bootCI
  # ci.location -- Location parameters and contrasts
  - meanCI
  - meanCIn
  - meanDiffCI
  - medianCI
  - quantileCI
  - sumCI

- title: Confidence Intervals for Proportions, Rates & Dispersion
  desc: >
    Confidence intervals for categorical outcomes, rates, correlations, and scale parameters.
  contents:
  # ci.proportion -- Binomial and multinomial proportions
  - binomCI
  - binomDiffCI
  - binomRatioCI
  - multinomCI
  # ci.rate -- Poisson rates
  - poissonCI
  - poissonDiffCI
  - poissonRatioCI
  # ci.correlation -- Correlation
  - corCI
  # ci.variance -- Dispersion and variance
  - mad-confints
  - varCI

- title: Location & Correlation Tests
  desc: >
    Parametric, nonparametric, robust, multivariate, and correlation tests.
  contents:
  # test.location -- Location and stochastic-order comparisons
  - brunnerMunzelTest
  - hotellingsT2Test
  - moodMedianTest
  - signTest
  - tTestA
  - vanWaerdenTest
  - yuenTTest
  - zTest
  # test.correlation -- Correlation tests
  - corTest

- title: Categorical Data Tests
  desc: >
    Tests for proportions, contingency tables, marginal homogeneity, and ordinal trends.
  contents:
  # test.categorical -- Independent and paired categorical data
  - barnardTest
  - bhapkarTest
  - breslowDayTest
  - cochranArmitageTest
  - cochranQTest
  - gTest
  - lehmacherTest
  - mantelTrendTest
  - stuartMaxwellTest
  - woolfTest

- title: Variance & Dispersion Tests
  desc: >
    Parametric, robust, and rank-based comparisons of variability.
  contents:
  # test.variance -- Variance and dispersion
  - leveneTest
  - mosesTest
  - siegelTukeyTest
  - varTest

- title: Normality & Goodness-of-Fit Tests
